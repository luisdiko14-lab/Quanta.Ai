services:
  - type: web
    name: quanta-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_FREE
        sync: false
      - key: GEMINI_MODEL_PREMIUM
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_BUDGET
        sync: false
      - key: GROQ_MODEL_LLAMA_70B
        sync: false
      - key: GROQ_MODEL_QWEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL_CHAT
        sync: false
      - key: DEEPSEEK_MODEL_REASONER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: PROVIDER_KEYS_ENCRYPTION_KEY
        sync: false
